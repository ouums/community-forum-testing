[pytest]
markers =
    slow: 慢速用例（涉及写接口控频）
    write: 写操作用例（受限流影响）
    auth: 认证鉴权模块
    post: 帖子模块
    comment: 评论模块
    search: 搜索模块
    permission: 权限模块
xfail_strict = true

; ---- 核心步骤日志（0~4 编号，格式与落点见 conftest.py「核心步骤日志」节）----
; 控制台只打「0.测试用例的描述信息」（conftest 的 _ConsoleOnlyCaseTitle 滤网），
; 1~4 步只进 logs/api_run_*.log，避免请求头/响应体把终端刷屏。
; log_cli 必须开：不开的话 pytest 会把日志捕获起来，通过用例的日志一条都看不到。
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
log_level = INFO

; --show-capture=no：不再在报告里重复贴一遍 Captured log/stdout/stderr
; （开了 log_cli 后，这些内容控制台已经打过一遍、日志文件里也有，属纯重复）。
; 要看失败细节：日志文件、Allure 报告，或临时去掉这个参数。
addopts = -v -rA --tb=short --show-capture=no --alluredir=./allure-results --clean-alluredir
testpaths = .
